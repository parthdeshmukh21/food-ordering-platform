apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: food-ordering

spec:
  replicas: 2

  selector:
    matchLabels:
      app: notification-service

  template:
    metadata:
      labels:
        app: notification-service

    spec:
      containers:
      - name: notification-service
        image: parthh21/notification-service:v1

        ports:
        - containerPort: 8080
